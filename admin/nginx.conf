# Admin SPA (admin.bom-beauty.com behind Caddy). Hashed assets are immutable; index.html is never cached so a deploy
# reaches open tabs on their next navigation.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri /index.html;
  }
}
